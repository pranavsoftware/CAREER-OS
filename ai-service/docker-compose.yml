version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_os_ai_service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEFAULT_VOICE=en_gb_female
    restart: unless-stopped
